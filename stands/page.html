<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Отрисовка — Штурм идей</title>
<link rel="icon" href="data:,">
<style>
  @font-face { font-family: "Rubik"; src: url("/fonts/Rubik.ttf"); font-weight: 300 900; }
  @font-face { font-family: "Nunito"; src: url("/fonts/Nunito.ttf"); font-weight: 200 1000; }
  @font-face { font-family: "Caveat"; src: url("/fonts/Caveat.ttf"); font-weight: 400 700; }
  html, body { margin: 0; background: #222; }
  canvas { display: block; }
  body.lookplay { overflow: hidden; background: #000; } body.lookplay canvas { width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<!-- Стенд отрисовки обложки и первого кадра (render_shot.js). Сцена: ?scene=/rscene/<plan>/<concept>/v<N>/scene.js
     Контракт сцены:  const PICS = { key: '/files/<plan>/7.png', … };      картинки -> IMG.key
                      const COVER = { draw(ctx) { … } };                     обложка 1080×1920, статичная
                      const FRAME = { t: 0.6, draw(ctx, T) { … } };          первый кадр, T — секунды от начала ролика
     Элемент препродакшена (…&parts=element): const ELEMENT = { t: 0.6, draw(ctx, T) { … } }; — лист персонажа, пропса или кадр сцены -->
<script src="/tpl/lib.js"></script>
<script>
  const IMG = {}, SEQ = {};
  const seqFrame = () => null;
</script>
<script src="/render/paper.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const load = src => new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src + (src.includes('?') ? '&' : '?') + 'v=' + Date.now(); s.onload = ok; s.onerror = () => bad(new Error('сцена не загрузилась: ' + src)); document.head.append(s); });
  const pic = (k, src) => new Promise(ok => { const im = new Image(); im.onload = () => { IMG[k] = im; ok(); }; im.onerror = () => { console.error('картинка не загрузилась: ' + src); ok(); }; im.src = src; });
  if (q.get('lookj')) { try { window.LOOK = JSON.parse(q.get('lookj')); } catch (e) { console.error('lookj: ' + e.message); } }   // S14: визуал канала до загрузки сцены
  const LOOKF = q.get('lookf') ? fetch(q.get('lookf') + (q.get('lookf').includes('?') ? '&' : '?') + 'v=' + Date.now()).then(r => r.json()).then(j => { window.LOOK = j; }).catch(e => console.error('lookf: ' + e.message)) : null;   // …или файлом look.json (✨ сборка визуала)
  window.READY = (async () => {
    if (LOOKF) await LOOKF;
    await load(q.get('scene'));
    const P = typeof PICS !== 'undefined' ? PICS : {};
    await Promise.all(Object.entries(P).map(([k, s]) => pic(k, s)));
    await Promise.all(['900 40px Rubik', '800 40px Nunito', '700 40px Caveat'].map(f => document.fonts.load(f).catch(() => {})));
  })();
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const paint = t => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H); ELEMENT.draw(ctx, t); };
  window.shot = (kind, t, fmt) => {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    if (kind === 'cover') COVER.draw(ctx);
    else if (kind === 'element') ELEMENT.draw(ctx, t != null ? t : (ELEMENT.t != null ? ELEMENT.t : 0.6));
    else FRAME.draw(ctx, t != null ? t : (FRAME.t != null ? FRAME.t : 0.6));
    return fmt === 'jpg' ? cv.toDataURL('image/jpeg', 0.95) : cv.toDataURL('image/png');
  };
  // S14 превью визуала: ?lookj=<window.LOOK>&play=1 — петля ELEMENT.len в окошке «Стиль → Визуалы»; ручки приходят postMessage({look}) без перезагрузки
  function lookPlay(is3d) {
    document.body.classList.add('lookplay');
    let t0 = performance.now(), paused = false, at = 0;
    const loop = () => { if (!paused) { at = ((performance.now() - t0) / 1000) % (+ELEMENT.len || 5); paint(at); } requestAnimationFrame(loop); };
    window.addEventListener('message', e => {
      const m = e.data || {};
      if (m.look) { window.LOOK = Object.assign({}, m.look, { palette: (window.LOOK || {}).palette, heroes: (window.LOOK || {}).heroes });
        if (is3d) for (const w of X3.worlds) { try { w.comp && w.comp.dispose(); } catch (er) {} w._post(); }
        if (paused) paint(at); }
      if (m.pause != null) { paused = !!m.pause; t0 = performance.now() - at * 1000; }
      if (m.seek != null) { at = +m.seek; t0 = performance.now() - at * 1000; paint(at); }
    });
    requestAnimationFrame(loop);
  }
  if (q.get('play') === '1') READY.then(() => lookPlay(false));
  else if (!navigator.webdriver) READY.then(() => shot(q.get('kind') || (q.get('parts') === 'element' ? 'element' : 'cover'), q.get('t') != null ? +q.get('t') : null));   // open in a browser to look
</script>
</body>
</html>
