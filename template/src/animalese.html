<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Конструктор Animalese</title>
<style>
  :root { --bg: #14121c; --panel: #1f1c2b; --line: #332f45; --txt: #ece8f6; --dim: #9a94b0; --acc: #ffd23f; --acc2: #7ee0b8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt); font: 15px/1.45 "Nunito", system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }
  h1 { font-size: 24px; margin: 0 0 4px; } .sub { color: var(--dim); margin: 0 0 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 16px; }
  textarea { width: 100%; min-height: 64px; background: #120f19; color: var(--txt); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 18px "Nunito", sans-serif; resize: vertical; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  button, select { background: #2c2840; color: var(--txt); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; font: 600 15px "Nunito", sans-serif; cursor: pointer; }
  button:hover { border-color: var(--acc); } button.main { background: var(--acc); color: #1a1600; border-color: var(--acc); font-size: 17px; padding: 10px 22px; }
  button.sel { border-color: var(--acc2); color: var(--acc2); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px 22px; }
  .p label { display: flex; justify-content: space-between; color: var(--dim); font-size: 13px; }
  .p label b { color: var(--txt); font-weight: 700; }
  .p input[type=range] { width: 100%; accent-color: var(--acc); }
  .p .hint { color: #6f6a86; font-size: 12px; }
  #viz { width: 100%; height: 90px; background: #120f19; border-radius: 10px; display: block; margin-top: 12px; }
  #letters { font: 22px "Nunito", monospace; letter-spacing: 1px; min-height: 30px; margin-top: 8px; color: var(--dim); }
  #letters span.on { color: var(--acc); }
  pre { background: #120f19; border-radius: 10px; padding: 10px 12px; color: var(--acc2); white-space: pre-wrap; margin: 10px 0 0; font-size: 13px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--acc2); color: #062; padding: 10px 18px; border-radius: 10px; font-weight: 700; opacity: 0; transition: opacity .2s; }
  @media (max-width: 600px) { main { padding: 16px; } }
</style>
</head>
<body>
<main>
  <h1>Конструктор Animalese</h1>
  <p class="sub">«Звериная речь» как в Animal Crossing: каждая буква — короткий ускоренный слог. Двигай ползунки, слушай, а когда понравится — «Скопировать настройки» и пришли их в чат. В ролике будет тот же алгоритм (<code>_pipeline/animalese.py</code>).</p>

  <div class="card">
    <textarea id="text">Будь другом, сбегай наверх за ней!</textarea>
    <div class="row">
      <button class="main" id="play">▶ Слушать</button>
      <button id="stop">■</button>
      <select id="voice"><option value="ru-RU-SvetlanaNeural">Светлана (жен.)</option><option value="ru-RU-DmitryNeural">Дмитрий (муж.)</option></select>
      <span style="color:var(--dim)">Пресеты:</span>
      <span id="presets"></span>
    </div>
    <div class="row" style="margin-top:6px">
      <span style="color:var(--dim)">Фразы:</span>
      <span id="phrases"></span>
    </div>
    <div id="letters"></div>
    <canvas id="viz" width="940" height="90"></canvas>
  </div>

  <div class="card"><div class="grid" id="params"></div></div>

  <div class="card">
    <div class="row" style="margin-top:0">
      <button id="copy">📋 Скопировать настройки</button>
      <button id="save">💾 Скачать WAV</button>
      <button id="reset">↺ Сбросить</button>
    </div>
    <pre id="json"></pre>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
// ---------- parameters (the same names as speak() in _pipeline/animalese.py) ----------
const PARAMS = [
  ['pitch',    'Высота (ускорение буквы)', 1.0, 3.2, 0.01, 1.6, '×', '1,5 — взрослый, 2 — ребёнок, 2,5+ — мышка'],
  ['rate',     'Темп, букв в секунду',     5,   26,  0.5,  14,  '',  'в игре около 12–16'],
  ['clip',     'Длина звука буквы',        50,  220, 5,    130, 'мс', 'сколько берём от слога до ускорения: меньше — «щелчки», больше — разборчивее'],
  ['jitter',   'Разброс тона',             0,   25,  0.5,  6,   '%', 'случайно для каждой буквы'],
  ['sing',     'Мелодия (плавная волна тона)', 0, 25, 0.5, 0,   '%', 'тон плывёт вверх-вниз по фразе'],
  ['question', 'Подъём в конце вопроса',   0,   60,  1,    16,  '%', 'на последних буквах, если фраза кончается «?»'],
  ['exclaim',  'Нажим в конце «!»',        0,   40,  1,    8,   '%', 'последние буквы чуть выше и громче'],
  ['cons',     'Громкость согласных',      0.2, 1.4, 0.05, 0.8, '×', 'гласные = 1'],
  ['space',    'Пауза между словами',      0,   2.5, 0.05, 0.6, '× шага', ''],
  ['comma',    'Пауза на запятой',         0,   5,   0.1,  1.8, '× шага', ''],
  ['stop',     'Пауза на точке, «!», «?»', 0,   8,   0.1,  3.0, '× шага', ''],
  ['tail',     'Затухание буквы',          5,   80,  1,    30,  'мс', 'хвост каждого слога'],
  ['volume',   'Громкость',                0.1, 1.5, 0.05, 0.9, '×', ''],
];
const PRESETS = {
  'Мама':  { voice: 'ru-RU-SvetlanaNeural', pitch: 1.6, rate: 14, clip: 130, jitter: 6, sing: 3, question: 16, exclaim: 8, cons: 0.8, space: 0.6, comma: 1.8, stop: 3, tail: 30, volume: 0.9 },
  'Ёжик':  { voice: 'ru-RU-DmitryNeural', pitch: 2.1, rate: 16, clip: 120, jitter: 8, sing: 4, question: 22, exclaim: 10, cons: 0.8, space: 0.6, comma: 1.8, stop: 3, tail: 25, volume: 0.9 },
  'Спокойно': { voice: 'ru-RU-SvetlanaNeural', pitch: 1.35, rate: 11, clip: 150, jitter: 4, sing: 6, question: 14, exclaim: 5, cons: 0.75, space: 0.8, comma: 2.2, stop: 3.5, tail: 40, volume: 0.9 },
  'Мышка': { voice: 'ru-RU-SvetlanaNeural', pitch: 2.7, rate: 19, clip: 90, jitter: 10, sing: 2, question: 25, exclaim: 12, cons: 0.7, space: 0.5, comma: 1.5, stop: 2.5, tail: 15, volume: 0.9 },
};
const PHRASES = ['Кажется, я забыла сумку...', 'Будь другом, сбегай наверх за ней!', 'Кажется, я тут уже проходил? А что с ними не так?', 'Нам быстро туда-обратно, даже сумку брать не буду.'];
const VOWELS = 'аоуыэиеёюя', CONS = 'бвгджзклмнпрстфхцчшщй';
const LETTERS = (VOWELS + CONS).split('');
const $ = id => document.getElementById(id);
let P = {}, voice = 'ru-RU-SvetlanaNeural';

// ---------- UI ----------
function buildParams() {
  const box = $('params'); box.innerHTML = '';
  for (const [k, name, a, b, st, def, unit, hint] of PARAMS) {
    const d = document.createElement('div'); d.className = 'p';
    d.innerHTML = `<label>${name} <b id="v_${k}"></b></label><input type="range" id="r_${k}" min="${a}" max="${b}" step="${st}"><div class="hint">${hint}</div>`;
    box.append(d);
    const r = d.querySelector('input'); r.value = P[k] ?? def;
    r.oninput = () => { P[k] = +r.value; show(); };
    r.onchange = () => play();
  }
  show();
}
function show() {
  for (const [k, , , , , , unit] of PARAMS) { if (!$('v_' + k)) continue; $('v_' + k).textContent = `${P[k]}${unit ? ' ' + unit : ''}`; $('r_' + k).value = P[k]; }
  $('voice').value = voice;
  $('json').textContent = JSON.stringify({ voice, ...P });
  try { localStorage.setItem('animalese', JSON.stringify({ voice, P, text: $('text').value })); } catch {}
}
function applyPreset(o) { voice = o.voice || voice; for (const [k] of PARAMS) if (o[k] != null) P[k] = o[k]; show(); }
for (const [n, o] of Object.entries(PRESETS)) { const b = document.createElement('button'); b.textContent = n; b.onclick = () => { applyPreset(o); play(); }; $('presets').append(b, ' '); }
for (const t of PHRASES) { const b = document.createElement('button'); b.textContent = t.length > 28 ? t.slice(0, 26) + '…' : t; b.title = t; b.onclick = () => { $('text').value = t; show(); play(); }; $('phrases').append(b, ' '); }
$('voice').onchange = () => { voice = $('voice').value; show(); play(); };
$('text').oninput = show;
$('reset').onclick = () => { applyPreset(PRESETS['Мама']); play(); };
$('copy').onclick = async () => { const s = JSON.stringify({ voice, ...P }); try { await navigator.clipboard.writeText(s); } catch { const t = document.createElement('textarea'); t.value = s; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); } toast('Скопировано — вставь в чат'); };
function toast(s) { const t = $('toast'); t.textContent = s; t.style.opacity = 1; setTimeout(() => (t.style.opacity = 0), 1600); }

// ---------- audio: letter samples ----------
const AC = new (window.AudioContext || window.webkitAudioContext)();
const SAMPLES = {};   // voice -> letter -> Float32Array (trimmed from the onset, not cut to length yet)
async function loadVoice(v) {
  if (SAMPLES[v]) return SAMPLES[v];
  const out = {};
  await Promise.all(LETTERS.map(async ch => {
    const r = await fetch(`../assets/animalese/${v}/${encodeURIComponent(ch)}.mp3`); if (!r.ok) return;
    const buf = await AC.decodeAudioData(await r.arrayBuffer());
    const x = buf.getChannelData(0); let mx = 0; for (const s of x) mx = Math.max(mx, Math.abs(s));
    let on = 0; while (on < x.length && Math.abs(x[on]) < mx * 0.08) on++;
    on = Math.max(0, on - Math.round(0.005 * buf.sampleRate));
    out[ch] = { data: x.slice(on, on + Math.round(0.3 * buf.sampleRate)), sr: buf.sampleRate, peak: mx };
  }));
  return (SAMPLES[v] = out);
}
// build the letter events exactly like speak() in animalese.py
// spoken spelling: «кажется» -> «кажеца» (same rules as PHON in _pipeline/animalese.py)
const PHON = [['ться', 'ца'], ['тся', 'ца'], ['чтобы', 'штобы'], ['что', 'што'], ['сч', 'щ'], ['жч', 'щ'], ['здн', 'зн'], ['стн', 'сн'], ['вств', 'ств'], ['лнц', 'нц'], ['его ', 'ево '], ['ого ', 'ова '], ['ь', ''], ['ъ', '']];
const phonetic = s => { let t = ' ' + s.toLowerCase().split(/\r?\n/).join(' ') + ' '; for (const [a, b] of PHON) t = t.split(a).join(b); return t.trim(); };
function events(text, L) {
  let rs = 1;                                   // tiny deterministic RNG (same phrase -> same melody)
  const rnd = () => ((rs = (rs * 16807) % 2147483647) / 2147483647);
  const t0 = phonetic(text), step = 1 / P.rate;
  const q = /\?\s*$/.test(t0), ex = /!\s*$/.test(t0);
  const n = [...t0].filter(c => L[c]).length;
  let t = 0.05, i = 0; const ev = [];
  for (const ch of t0) {
    if (L[ch]) {
      i++;
      let k = P.pitch * (1 + (rnd() * 2 - 1) * P.jitter / 100) * (1 + Math.sin(i * 0.55) * P.sing / 100);
      const fromEnd = n - i;                    // 0 = the last letter
      if (q && fromEnd < 4) k *= 1 + P.question / 100 * (4 - fromEnd) / 4;
      let g = (CONS.includes(ch) ? P.cons : 1) * P.volume;
      if (ex && fromEnd < 3) { k *= 1 + P.exclaim / 100 * (3 - fromEnd) / 3; g *= 1.15; }
      ev.push({ t, ch, k, g, i: i - 1 }); t += step;
    } else if (ch === ' ') t += step * P.space;
    else if (',:;—-'.includes(ch)) t += step * P.comma;
    else if ('.!?…'.includes(ch)) t += step * P.stop;
  }
  return { ev, dur: t + 0.4 };
}
function letterBuffer(ctx, s, k) {
  const n = Math.min(s.data.length, Math.round(P.clip / 1000 * s.sr));
  const b = ctx.createBuffer(1, n, s.sr), y = b.getChannelData(0), f = Math.min(n, Math.round(P.tail / 1000 * s.sr));
  for (let j = 0; j < n; j++) y[j] = s.data[j] / s.peak * (j >= n - f ? (n - j) / f : 1);
  return b;
}
function schedule(ctx, L, text, when) {
  const { ev, dur } = events(text, L);
  const master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
  const srcs = [];
  for (const e of ev) {
    const s = L[e.ch]; if (!s) continue;
    const src = ctx.createBufferSource(); src.buffer = letterBuffer(ctx, s, e.k); src.playbackRate.value = e.k;   // faster = higher, like the game
    const g = ctx.createGain(); g.gain.value = e.g; src.connect(g).connect(master); src.start(when + e.t); srcs.push(src);
  }
  return { ev, dur, srcs };
}
let playing = null;
async function play() {
  stop(); await AC.resume();
  const L = await loadVoice(voice), text = $('text').value;
  const when = AC.currentTime + 0.05, r = schedule(AC, L, text, when);
  playing = r; drawLetters(text, r, when);
}
function stop() { if (playing) { playing.srcs.forEach(s => { try { s.stop(); } catch {} }); playing = null; } }
$('play').onclick = play; $('stop').onclick = stop;
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); play(); } });

// letters light up while they sound + a little timeline
function drawLetters(text, r, when) {
  const box = $('letters'); box.innerHTML = ''; const spans = [];
  let li = 0;
  for (const ch of phonetic(text)) { const s = document.createElement('span'); s.textContent = ch; box.append(s); if (r.ev[li] && ch === r.ev[li].ch) { spans[li] = s; li++; } }
  const cv = $('viz'), g = cv.getContext('2d');
  const tick = () => {
    if (playing !== r) return;
    const now = AC.currentTime - when;
    g.clearRect(0, 0, cv.width, cv.height);
    for (const e of r.ev) {
      const x = e.t / r.dur * cv.width, h = Math.min(80, 20 + (e.k - 1) * 30);
      g.fillStyle = e.t <= now ? '#ffd23f' : '#4a4466'; g.fillRect(x, cv.height - h - 5, Math.max(2, cv.width / r.dur / P.rate * 0.7), h);
    }
    g.fillStyle = '#7ee0b8'; g.fillRect(now / r.dur * cv.width, 0, 2, cv.height);
    r.ev.forEach((e, j) => spans[j] && spans[j].classList.toggle('on', e.t <= now && now < e.t + 0.12));
    if (now < r.dur) requestAnimationFrame(tick);
  };
  tick();
}
// offline render -> WAV download
$('save').onclick = async () => {
  const L = await loadVoice(voice), text = $('text').value, { dur } = events(text, L);
  const off = new OfflineAudioContext(1, Math.ceil(dur * 44100), 44100);
  schedule(off, L, text, 0);
  const buf = await off.startRendering(), x = buf.getChannelData(0);
  const dv = new DataView(new ArrayBuffer(44 + x.length * 2)), w = (o, s) => [...s].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); dv.setUint32(4, 36 + x.length * 2, true); w(8, 'WAVEfmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, 44100, true); dv.setUint32(28, 88200, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); w(36, 'data'); dv.setUint32(40, x.length * 2, true);
  for (let i = 0; i < x.length; i++) dv.setInt16(44 + i * 2, Math.max(-1, Math.min(1, x[i])) * 32767, true);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([dv], { type: 'audio/wav' })); a.download = 'animalese.wav'; a.click();
};

// ---------- boot ----------
(() => {
  let saved = null; try { saved = JSON.parse(localStorage.getItem('animalese') || 'null'); } catch {}
  applyPreset(PRESETS['Мама']);
  if (saved) { voice = saved.voice || voice; Object.assign(P, saved.P || {}); if (saved.text) $('text').value = saved.text; }
  buildParams();
  loadVoice('ru-RU-SvetlanaNeural'); loadVoice('ru-RU-DmitryNeural');
})();
</script>
</body>
</html>
