<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Claude Studio</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1c20; color: #d8d4cc; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .box { text-align: center; max-width: 640px; padding: 24px; }
  h1 { font-weight: 600; font-size: 22px; margin: 0 0 8px; }
  .dim { color: #8b8880; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #d97757; margin: 0 3px; animation: b 1.2s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: .2s } .dot:nth-child(3) { animation-delay: .4s }
  @keyframes b { 0%, 80%, 100% { opacity: .2 } 40% { opacity: 1 } }
  pre { text-align: left; white-space: pre-wrap; background: #25262c; border-radius: 8px; padding: 12px; font-size: 12px; max-height: 50vh; overflow: auto; }
  .err h1 { color: #e0876a; }
  .deps { list-style: none; padding: 0; text-align: left; display: inline-block; margin: 8px 0 14px; }
  .deps li { padding: 2px 0; } .deps .ok { color: #8fbf7f; } .deps .no { color: #e0a080; }
  .btn, .btn2 { display: inline-block; padding: 8px 16px; border-radius: 8px; text-decoration: none; margin: 4px; }
  .btn { background: #d97757; color: #fff; } .btn2 { background: #2f3037; color: #d8d4cc; }
  .btn.busy { opacity: .5; pointer-events: none; }
  .small { font-size: 12px; }
  #log { display: none; }
</style>
</head>
<body>
<div class="box" id="box">
  <h1>Claude Studio</h1>
  <p class="dim" id="msg">Запускаю локальный скрипт приложения…</p>
  <p><span class="dot"></span><span class="dot"></span><span class="dot"></span></p>
</div>
<script>
  // Окно само переходит на http://localhost:<порт>/, когда приложение ответит (main.rs).
  // Если не вышло — main.rs вызывает showError(текст).
  function showError(text) {
    const b = document.getElementById('box');
    b.className = 'box err';
    b.innerHTML = '<h1>Не запустилось</h1><p class="dim">Что сказал локальный скрипт:</p><pre></pre>' +
      '<p class="dim">Проверь, что установлен Python, и попробуй «Claude Studio.bat» в рабочей папке — там видно всё, что он пишет.</p>';
    b.querySelector('pre').textContent = text;
  }
  function status(text) {
    const m = document.getElementById('msg');
    if (m) m.textContent = text; else setupLog(text);
  }
  // Мастер первого запуска (установленная программа): чего не хватает на компьютере.
  // Кнопки — ссылки studio://…, их перехватывает main.rs (on_navigation).
  function showSetup(list) {
    const b = document.getElementById('box');
    const old = document.getElementById('log');
    b.className = 'box';
    b.innerHTML = '<h1>Claude Studio — первый запуск</h1>' +
      '<p class="dim">Для роликов нужны бесплатные программы. Отмеченные ✗ я поставлю сам — это займёт 5–15 минут.</p>' +
      '<ul class="deps">' + list.map(d => `<li class="${d.ok ? 'ok' : 'no'}">${d.ok ? '✓' : '✗'} ${d.name}</li>`).join('') + '</ul>' +
      '<p><a class="btn" id="go" href="studio://setup/">Установить недостающее</a> ' +
      '<a class="btn2" href="studio://claude-login/">Войти в Claude</a> ' +
      '<a class="btn2" href="studio://skip/">Пропустить</a></p>' +
      '<p class="dim small">Claude Code работает на твоей подписке Claude (Pro или Max): после установки нажми «Войти в Claude» — откроется окно входа.</p>' +
      '<pre id="log"></pre>';
    if (old && old.textContent) { const l = document.getElementById('log'); l.textContent = old.textContent; l.style.display = 'block'; }
    document.getElementById('go').onclick = () => { document.getElementById('go').classList.add('busy'); setupLog('Начинаю установку…'); };
  }
  function setupLog(line) {
    const l = document.getElementById('log');
    if (!l) return;
    l.style.display = 'block';
    l.textContent += line + '\n';
    l.scrollTop = l.scrollHeight;
  }
</script>
</body>
</html>
